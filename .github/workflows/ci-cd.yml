name: CI/CD Pipeline - Microservicio Vehiculos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout del código (Trazabilidad)
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar Java 21
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Ejecutar Pruebas Automatizadas (IE2)
    - name: Ejecutar Pruebas Unitarias
      run: mvn clean test
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    # 4. Análisis de Seguridad y Bloqueo (IE3)
    - name: Análisis de Seguridad con Trivy
      uses: aquasecurity/trivy-action@0.28.0 # <--- CAMBIO AQUÍ (versión estable)
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1' 
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL' # <--- CAMBIO AQUÍ (solo bloquea si es CRÍTICO)

    # 5. Construcción de la Imagen Docker (IE1)
    - name: Construir Imagen Docker
      run: docker build -t ms-vehiculos-app:latest .

    # 6. Despliegue y Orquestación Automática (IE4 e IE5)
    - name: Desplegar con Docker Compose
      run: |
        export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        export DB_NAME=vehiculos_db
        docker compose up -d --build
        sleep 15
        docker ps
